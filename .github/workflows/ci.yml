# Every push and pull request: the three suites on the three platforms an agent runs on. Then, from the
# same commit, the two releases and the command line built per platform -- a release must be built on its
# target platform, and a box should not need Elixir installed to run an agent. A pull request builds them
# and proves the command line starts; only a push to main or a tag uploads them as artifacts.
#
# On a tag, the same artifacts are attached to a GitHub release.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  OTP_VERSION: "27.0"
  ELIXIR_VERSION: "1.18.4"
  MIX_ENV: test

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ matrix.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      # Each application's suite in its own directory: the domain needs no database, the agent none,
      # and the control plane creates its own SQLite file through its test alias.
      - run: mix test
        working-directory: apps/orbitorc
      - run: mix test
        working-directory: apps/orbitorc_agent
      - run: mix test
        working-directory: apps/orbitorc_web

  release:
    name: release (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - run: mix deps.get --only prod
      - run: mix compile
      # The agent: no Phoenix, no assets, no database. What ships to every box.
      - run: mix release orbitorc_agent --overwrite
      # The control plane, with its assets built in.
      - run: mix assets.deploy
        working-directory: apps/orbitorc_web
      - run: mix release orbitorc --overwrite
      # The command line as a standalone escript -- and a proof that it starts. It is built with this
      # umbrella's runtime configuration embedded, and once refused to start for want of a control
      # plane's environment; a verb against an unreachable address must answer, not crash.
      - run: mix escript.build
        working-directory: apps/orbitorc_cli
      - shell: bash
        run: |
          out="$(./orbitorc fleet --url http://127.0.0.1:9 2>&1 || true)"
          echo "$out" | grep -q "could not reach" || { echo "the command line did not start cleanly:"; echo "$out"; exit 1; }
        working-directory: apps/orbitorc_cli
      # Uploaded from a push only. A pull request's builds are installed by nobody (a box upgrades from a
      # tagged release), and each upload counts against the account's artifact storage quota.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: orbitorc_agent-${{ runner.os }}-${{ runner.arch }}
          path: _build/prod/rel/orbitorc_agent
          if-no-files-found: error
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: orbitorc-${{ runner.os }}-${{ runner.arch }}
          path: _build/prod/rel/orbitorc
          if-no-files-found: error
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: orbitorc-cli-${{ runner.os }}-${{ runner.arch }}
          path: apps/orbitorc_cli/orbitorc
          if-no-files-found: error
      # A tag is the version it releases: `v1.2.3` must be what VERSION says, or nothing is attached.
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match VERSION $version" >&2
            exit 1
          fi
      # A tag attaches the same three, archived, to a release.
      - if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        run: |
          tar -C _build/prod/rel -czf orbitorc_agent-${{ runner.os }}-${{ runner.arch }}.tar.gz orbitorc_agent
          tar -C _build/prod/rel -czf orbitorc-${{ runner.os }}-${{ runner.arch }}.tar.gz orbitorc
          cp apps/orbitorc_cli/orbitorc orbitorc-cli-${{ runner.os }}-${{ runner.arch }}
          # An agent verifies an upgrade against the checksum beside its archive.
          for f in orbitorc_agent-*.tar.gz orbitorc-*.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; done
      - if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path _build/prod/rel/orbitorc_agent -DestinationPath orbitorc_agent-${{ runner.os }}-${{ runner.arch }}.zip
          Compress-Archive -Path _build/prod/rel/orbitorc -DestinationPath orbitorc-${{ runner.os }}-${{ runner.arch }}.zip
          Copy-Item apps/orbitorc_cli/orbitorc orbitorc-cli-${{ runner.os }}-${{ runner.arch }}
          # An agent verifies an upgrade against the checksum beside its archive.
          Get-ChildItem *.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Set-Content -NoNewline "$($_.Name).sha256" }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: |
            orbitorc_agent-*.*
            orbitorc-*.*
            orbitorc-cli-*
          if-no-files-found: error

  # One job publishes a tag's release. Each matrix leg used to publish its own, and every leg after the
  # first appended its generated notes to the release, so a release carried them three times.
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    # Attaching assets and generating notes writes to the repository; the default token cannot, and the
    # first tag's release came out empty for want of this.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            orbitorc_agent-*
            orbitorc-*
